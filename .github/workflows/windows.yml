name: Windows

on:
  push:
    paths: ['windows/**', 'scripts/windows-*.ps1', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'scripts/windows-*.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Use an explicit image so native PDF/WPF behavior does not change with latest.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regression checks and self-contained publish
        shell: pwsh
        run: ./scripts/windows-build.ps1
      - name: WebView2 integration checks when runtime is available
        shell: pwsh
        run: ./scripts/windows-ui-test.ps1
      - name: Native crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          $checks = './windows/ShuiMan.Checks/bin/Release/net10.0-windows10.0.19041.0/ShuiMan.Checks.exe'
          if (Test-Path -LiteralPath $checks) {
            & $checks --fixtures (Join-Path $env:RUNNER_TEMP ('shuiman-probe-' + [guid]::NewGuid()))
            Write-Output "Fixture-only exit: $LASTEXITCODE"
            foreach ($filter in @('PDF count', 'single image rendering', 'layout invariants')) {
              & $checks --filter $filter
              Write-Output "$filter exit: $LASTEXITCODE"
            }
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') } |
            Select-Object -First 15 TimeCreated, ProviderName, Id, Message | Format-List
          # The original failed build step remains failed; diagnostics are best effort.
          exit 0
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: ShuiMan-Windows-x64
          path: |
            build/windows/ShuiMan-Windows-x64.zip
            build/windows/ShuiMan-Windows-x64.zip.sha256
          if-no-files-found: error
